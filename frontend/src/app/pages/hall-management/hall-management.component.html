<div class="page">
  <nav class="nav">
    <a [routerLink]="['/dashboard']" class="back">← Back to Dashboard</a>
  </nav>

  <div class="content">
    <div class="header">
      <h1>Manage Halls</h1>
      <button class="btn-primary" (click)="showForm = !showForm">
        {{ showForm ? 'Cancel' : '+ Add Hall' }}
      </button>
    </div>

    <div class="add-form" *ngIf="showForm">
      <h2>New Hall</h2>
      <div class="error" *ngIf="formError">{{ formError }}</div>
      <form (ngSubmit)="onSubmit()" #hallForm="ngForm">
        <div class="field">
          <label>Hall Name</label>
          <input type="text" [(ngModel)]="form.name" name="name" required #name="ngModel"
                 placeholder="e.g. Hall A" />
          <span class="validation-error" *ngIf="name.invalid && name.touched">Name is required.</span>
        </div>
        <div class="field">
          <label>Capacity</label>
          <input type="number" [(ngModel)]="form.capacity" name="capacity" required min="1" #capacity="ngModel"
                 placeholder="e.g. 100" />
          <span class="validation-error" *ngIf="capacity.invalid && capacity.touched">Capacity must be at least 1.</span>
        </div>
        <button type="submit" class="btn-primary" [disabled]="hallForm.invalid">Create Hall</button>
      </form>
    </div>

    <div class="loading" *ngIf="loading">Loading halls...</div>
    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="halls-list" *ngIf="!loading && !error">
      <div class="empty" *ngIf="halls.length === 0">No halls yet. Add one above.</div>

      <div class="hall-card" *ngFor="let hall of halls">
        <div class="hall-info">
          <h3>{{ hall.name }}</h3>
          <span>{{ hall.capacity }} seats</span>
        </div>
        <button class="btn-delete" (click)="deleteHall(hall.id)">Delete</button>
      </div>
    </div>
  </div>
</div>
