<div class="page">
  <app-header>
    <ng-container *ngIf="user?.role === 'ADMIN'">
      <a routerLink="/dashboard">Dashboard</a>
      <a routerLink="/admin/speakers">Speakers</a>
    </ng-container>
    <ng-container *ngIf="user?.role === 'ATTENDEE'">
      <a routerLink="/events">Events</a>
      <a routerLink="/my-tickets">My Tickets</a>
    </ng-container>
  </app-header>

  <div class="content">
    <h1>My Profile</h1>

    <div class="loading" *ngIf="loading">Loading profile...</div>
    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="profile-card" *ngIf="user && !loading">
      <div class="avatar">{{ user.name.charAt(0).toUpperCase() }}</div>

      <div class="profile-info">
        <div class="info-row">
          <span class="label">Name</span>
          <span class="value">{{ user.name }}</span>
        </div>
        <div class="info-row">
          <span class="label">Email</span>
          <span class="value">{{ user.email }}</span>
        </div>
        <div class="info-row">
          <span class="label">Role</span>
          <span class="role-badge" [class]="user.role.toLowerCase()">{{ user.role }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
