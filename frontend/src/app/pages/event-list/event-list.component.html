<div class="page">
  <app-header>
    <a routerLink="/my-tickets">My Tickets</a>
  </app-header>

  <div class="content">
    <h1>Amazing Events</h1>

    <div class="loading" *ngIf="loading">Loading events...</div>
    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="filters" *ngIf="!loading && !error">
      <button
        *ngFor="let filter of filters"
        class="filter-btn"
        [class.active]="activeFilter === filter"
        (click)="setFilter(filter)">
        {{ filter }}
      </button>
    </div>

    <div class="events-grid" *ngIf="!loading && !error">
      <a class="event-card" *ngFor="let event of filteredEvents" [routerLink]="['/events', event.id]">
        <div class="event-header">
          <span class="status" [class]="event.status.toLowerCase()">{{ event.status }}</span>
        </div>
        <h2>{{ event.title }}</h2>
        <p class="venue">{{ event.venue }}</p>
        <p class="date">{{ event.eventDate | date:'mediumDate' }}</p>
        <p class="capacity">{{ event.capacity }} seats</p>
      </a>

      <div class="empty" *ngIf="filteredEvents.length === 0">
        No events found.
      </div>
    </div>
  </div>
</div>
