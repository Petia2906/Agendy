<div class="page">
  <app-header>
    <a routerLink="/dashboard/create" class="btn-primary">+ Create Event</a>
    <a routerLink="/admin/speakers" class="btn-primary">Speakers</a>
  </app-header>

  <div class="content">
    <h1>My Dashboard</h1>
    <p class="subtitle">Manage your events</p>

    <div class="loading" *ngIf="loading">Loading...</div>
    <div class="error" *ngIf="error">{{ error }}</div>

    <div class="events-table" *ngIf="!loading && !error">
      <div class="empty" *ngIf="events.length === 0">
        No events yet. <a routerLink="/dashboard/create">Create your first event</a>
      </div>

      <table *ngIf="events.length > 0">
        <thead>
        <tr>
          <th>Title</th>
          <th>Venue</th>
          <th>Date</th>
          <th>Capacity</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let event of events">
          <td><a [routerLink]="['/events', event.id]">{{ event.title }}</a></td>
          <td>{{ event.venue }}</td>
          <td>{{ event.eventDate | date:'mediumDate' }}</td>
          <td>{{ event.capacity }}</td>
          <td>
            <span class="status" [class]="event.status.toLowerCase()">{{ event.status }}</span>
          </td>
          <td class="actions">
            <a [routerLink]="['/events', event.id, 'edit']" class="btn-manage">Edit</a>
            <a [routerLink]="['/events', event.id, 'halls']" class="btn-manage">Halls</a>
            <a [routerLink]="['/events', event.id, 'sessions']" class="btn-manage">Sessions</a>
            <button class="btn-delete" (click)="deleteEvent(event.id)">Delete</button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
