<div class="auth-page">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="subtitle">Join Agendy to manage your events</p>

    <div class="error" *ngIf="error">{{ error }}</div>

    <form (ngSubmit)="onSubmit()">
      <div class="field">
        <label>Name</label>
        <input type="text" [(ngModel)]="form.name" name="name" required placeholder="John Doe" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" [(ngModel)]="form.email" name="email" required placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" [(ngModel)]="form.password" name="password" required placeholder="••••••••" />
      </div>
      <div class="field">
        <label>I am a...</label>
        <select [(ngModel)]="form.role" name="role">
          <option value="ATTENDEE">Attendee</option>
          <option value="ADMIN">Organizer</option>
          <option value="SPEAKER">Speaker</option>
        </select>
      </div>
      <button type="submit" class="btn-primary">Create account</button>
    </form>

    <p class="switch">Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</div>
